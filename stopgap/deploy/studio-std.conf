# studio.visualtext.org, plain HTTP (port 80) -> force HTTPS
#
# cPanel include file. Install as root at:
#   /etc/apache2/conf.d/userdata/std/2_4/visualtext/studio.visualtext.org/proxy.conf
#
# Deliberately does NOT proxy to the container. Basic auth over plain HTTP
# sends the password in clear text on every request, so port 80 only ever
# redirects.

RewriteEngine On

# Exception for ACME. AutoSSL/Let's Encrypt validates over plain HTTP, and
# redirecting that to an HTTPS host whose certificate does not exist yet is a
# chicken-and-egg failure: the cert can never be issued.
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteCond %{HTTPS} !=on
RewriteRule ^/?(.*) https://studio.visualtext.org/$1 [R=301,L]
