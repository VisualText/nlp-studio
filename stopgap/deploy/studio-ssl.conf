# studio.visualtext.org -> NLP-Studio container on 127.0.0.1:3000
#
# cPanel include file. Install as root at:
#   /etc/apache2/conf.d/userdata/ssl/2_4/visualtext/studio.visualtext.org/proxy.conf
#
# READ THIS BEFORE EDITING
#
# The container runs openvscode-server with --without-connection-token, i.e.
# no authentication of its own, and it provides a terminal on this host. The
# Basic auth block below is the ONLY thing standing between the public
# internet and a shell on the machine that serves every visualtext.org site.
# Do not remove it or comment it out to "test something" -- replace it with
# something stronger, or take the site down first.

ProxyPreserveHost On
ProxyRequests Off

# DO NOT REMOVE -- this is a security control, not a performance tweak.
#
# cPanel puts nginx in front of Apache with proxy caching enabled per account
# ($CPANEL_PROXY_CACHE visualtext, $CPANEL_SKIP_PROXY_CACHING 0). Without
# these headers nginx caches the authenticated 200 response and then serves it
# to anonymous requests -- the password prompt still appears for some requests
# while others sail straight through to a cached copy of the editor. That was
# observed on this host: an unauthenticated request returned the full VS Code
# page even after the backend container had been stopped.
#
# nginx honours no-store/private and will not cache the response. The belt-and
# -braces fix is to also disable proxy caching for this account in WHM's NGINX
# Manager; see INSTALL.md.
Header always set Cache-Control "no-store, no-cache, private, max-age=0"
Header always set Pragma "no-cache"
Header unset ETag
FileETag None

# VS Code holds a long-lived WebSocket open. The Apache default timeout drops
# it after a few minutes, which shows up as the editor going grey and
# reconnecting while you type.
ProxyTimeout 1800

<Location />
    AuthType Basic
    AuthName "NLP-Studio"
    AuthUserFile /home/visualtext/.htpasswd-studio
    Require valid-user
</Location>

# The WebSocket rule must come BEFORE the generic ProxyPass. If ProxyPass
# matches first, the upgrade request is handled as ordinary HTTP, the socket
# never establishes, and the editor hangs on a blank grey screen with no
# error -- the single most common way this setup half-works.
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/?(.*) ws://127.0.0.1:3000/$1 [P,L]

ProxyPass        / http://127.0.0.1:3000/
ProxyPassReverse / http://127.0.0.1:3000/
