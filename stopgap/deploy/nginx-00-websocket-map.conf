# Install as root at: /etc/nginx/conf.d/00-websocket-map.conf
#
# Standard nginx WebSocket idiom: echo the client's Upgrade header back into
# the Connection header, and send "close" for ordinary requests.
#
# The 00- prefix matters. nginx.conf pulls in /etc/nginx/conf.d/*.conf in
# alphabetical order, and a map must be defined before the server block that
# references it.
#
# This is http-level and global, but it only defines a variable -- no other
# vhost is affected unless it references $connection_upgrade.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
