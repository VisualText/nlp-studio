# studio.visualtext.org -> NLP-Studio container, direct from nginx.
#
# Install as root at:
#   /etc/nginx/conf.d/users/visualtext/studio.visualtext.org/nlp-studio.conf
#
# Requires /etc/nginx/conf.d/00-websocket-map.conf for $connection_upgrade.
#
#
# WHY NGINX PROXIES THE CONTAINER DIRECTLY, SKIPPING APACHE
#
# Two problems with routing this domain through Apache:
#
# 1. WebSockets. cPanel's includes-optional/cpanel-proxy.conf sets
#    "proxy_http_version 1.0" and "proxy_hide_header Upgrade" to work around
#    an Apache 2.4.64 SNI issue. That silently kills the WebSocket upgrade, so
#    VS Code loads its HTML and then hangs on a grey screen, never connecting.
#    cPanel's own comment in that file says to override per-location.
#
# 2. Auth ordering. cPanel enables nginx proxy caching per account. With the
#    password check inside Apache, nginx cached the authenticated 200 and
#    served it to anonymous visitors -- observed on this host, and it kept
#    serving the editor page even after the backend container was stopped.
#    Putting auth in nginx, the outermost layer, makes that class of bug
#    impossible: nothing answers before the check runs.
#
#
# WHY A REGEX LOCATION
#
# The generated server block already contains "location /" (proxying to
# Apache), and this file is included after it. A second "location /" is a
# duplicate-location error. nginx evaluates regex locations before prefix
# locations, so "~ ^/" takes precedence without conflicting.
#
# cPanel's "location = /favicon.ico" and "= /robots.txt" are exact matches and
# still win over this regex. They fall through to Apache, which has its own
# copy of the same password gate (see studio-ssl.conf), so they stay protected.

location ~ ^/ {
    # The only thing between the public internet and a terminal on this host.
    # openvscode-server runs with --without-connection-token: no login of its
    # own. Do not remove this to debug something.
    auth_basic           "NLP-Studio";
    auth_basic_user_file /home/visualtext/.htpasswd-studio;

    # Land visitors on the example analyzers rather than an empty editor.
    #
    # The extension populates its analyzer, sequence and KB views from
    # vscode.workspace.workspaceFolders. With no ?folder= they are all empty
    # and the app looks broken to someone who has never seen it before.
    # /home/examples is the same directory the "Load Example Analyzers" cog
    # opens.
    #
    # Only a bare "/" is redirected. The WebSocket endpoint is also "/" but
    # always carries a query string (?type=ExtensionHost&...), so it never
    # matches -- redirecting it would break the editor.
    if ($request_uri = "/") {
        return 302 $scheme://$host/?folder=/home/examples;
    }

    proxy_pass http://127.0.0.1:3000;

    # WebSocket upgrade. 1.1 is required; 1.0 cannot carry an upgrade.
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # VS Code holds its socket open while idle. The nginx default of 60s drops
    # it and the editor reconnect-loops.
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    # Never cache. Belt and braces alongside auth living out here.
    proxy_cache        off;
    proxy_no_cache     1;
    proxy_cache_bypass 1;
}
