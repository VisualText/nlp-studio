# studio.visualtext.org/studio/ -> the NLP Studio app (127.0.0.1:3002), behind the
# site's password. See INSTALL.md.
#
# Install as root beside the phase-1 file, in the same directory:
#   /etc/nginx/conf.d/users/visualtext/studio.visualtext.org/nlp-studio-app.conf
#
# Exactly one of nginx-app-password.conf and nginx-app-signin.conf goes there, under
# that one name. This is the one for before GitHub sign-in is set up.
#
# "^~" makes these the answer for /studio/ ahead of the phase-1 file's "~ ^/" regex:
# when the longest matching prefix location carries ^~, nginx does not look at regex
# locations at all, so which file is read first does not matter.

# The page's URLs are relative, so it must be loaded from /studio/, not /studio.
# Answered before any password, and says nothing but where to go.
location = /studio {
    return 301 /studio/;
}

location ^~ /studio/ {
    # The phase-1 editor's password (stopgap/deploy/nginx-studio.conf), for the same
    # reason: the app runs analyzers, which is running their authors' code on this host.
    auth_basic           "NLP-Studio";
    auth_basic_user_file /home/visualtext/.htpasswd-studio;

    # The trailing slash strips /studio/: the app serves itself at its root.
    proxy_pass http://127.0.0.1:3002/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # A run request carries the whole analyzer (studio/server/app.py allows 12 MB).
    # The nginx default of 1 MB would turn a larger analyzer into a 413.
    client_max_body_size 12m;

    # A run is stopped after 10 s, and may first wait up to 15 s for a free slot.
    proxy_read_timeout 60s;

    # Never cache. cPanel turns on nginx proxy caching per account, and a cached
    # authenticated response has been served to anonymous visitors on this host.
    proxy_cache        off;
    proxy_no_cache     1;
    proxy_cache_bypass 1;
    add_header Cache-Control "private, no-cache" always;
}
