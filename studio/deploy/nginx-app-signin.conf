# studio.visualtext.org/studio/ -> the NLP Studio app (127.0.0.1:3002), with GitHub
# sign-in instead of the site's password. See INSTALL.md, "Switching to GitHub sign-in".
#
# Install as root beside the phase-1 file, in the same directory:
#   /etc/nginx/conf.d/users/visualtext/studio.visualtext.org/nlp-studio-app.conf
#
# Exactly one of nginx-app-password.conf and nginx-app-signin.conf goes there, under
# that one name. This one ONLY once the app runs with NLP_STUDIO_REQUIRE_SIGN_IN=1 and
# /studio/api/health answers "signIn": true: with no password here, the app's sign-in is
# what keeps strangers from running analyzers, and REQUIRE_SIGN_IN makes the app refuse
# to start without it rather than start open.
#
# What anyone can reach without signing in: the page, the studio's own sample analyzers,
# and /api/health. Running analyzers and everything that touches GitHub answer 401
# until an invited person has signed in.
#
# "^~" makes these the answer for /studio/ ahead of the phase-1 file's "~ ^/" regex:
# when the longest matching prefix location carries ^~, nginx does not look at regex
# locations at all, so which file is read first does not matter.

# The page's URLs are relative, so it must be loaded from /studio/, not /studio.
location = /studio {
    return 301 /studio/;
}

location ^~ /studio/ {
    # The trailing slash strips /studio/: the app serves itself at its root.
    proxy_pass http://127.0.0.1:3002/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # A run request carries the whole analyzer (studio/server/app.py allows 12 MB).
    # The nginx default of 1 MB would turn a larger analyzer into a 413.
    client_max_body_size 12m;

    # A run is stopped after 10 s, and may first wait up to 15 s for a free slot; a
    # commit writes to GitHub, which is usually quicker.
    proxy_read_timeout 60s;

    # Never cache: responses depend on who is signed in, and cPanel turns on nginx
    # proxy caching per account.
    proxy_cache        off;
    proxy_no_cache     1;
    proxy_cache_bypass 1;
    add_header Cache-Control "private, no-cache" always;
}
