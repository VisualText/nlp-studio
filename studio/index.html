<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NLP Studio</title>
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <strong class="brand">NLP Studio</strong>
        <label class="pick">
          <span class="muted">Analyzer</span>
          <select id="analyzer" aria-label="Analyzer"></select>
        </label>
        <span class="pick">
          <button id="run" type="button" class="run" title="Run the analyzer on the input file (F5)" disabled>Run</button>
          <span id="run-on" class="muted"></span>
        </span>
        <span class="pick">
          <button id="download" type="button" title="Download this analyzer, with your edits, as a zip">Download</button>
          <button id="revert-all" type="button" title="Put every changed file back as it was opened" hidden>Revert all</button>
          <span id="changes" class="muted"></span>
        </span>
        <span id="status" class="muted grow">Starting…</span>
        <span id="account" class="pick"></span>
        <button id="theme" type="button" title="Light or dark">Theme</button>
      </header>
      <main class="layout">
        <nav id="files" class="files" aria-label="Passes and files"></nav>
        <section class="editor-pane">
          <div id="path" class="path mono"></div>
          <div id="editor" class="editor"></div>
          <div id="problems" class="problems"></div>
          <section id="results" class="results" aria-label="Run results" hidden>
            <div class="results-bar" role="tablist">
              <button type="button" role="tab" data-tab="output">Output</button>
              <button type="button" role="tab" data-tab="tree">Parse tree</button>
              <button type="button" role="tab" data-tab="problems">Problems</button>
              <button type="button" role="tab" data-tab="log">Log</button>
              <span class="results-summary grow"></span>
              <button type="button" class="results-close" title="Close" aria-label="Close run results">×</button>
            </div>
            <div class="results-body"></div>
          </section>
        </section>
      </main>
    </div>
    <dialog id="github-dialog" class="github-dialog" aria-labelledby="github-title">
      <form method="dialog" class="github-form">
        <h2 id="github-title">Open from GitHub</h2>
        <label class="pick">
          <span class="muted">Repository</span>
          <select id="github-repo" aria-label="Repository"></select>
        </label>
        <p id="github-note" class="muted"></p>
        <ol id="github-analyzers" class="github-analyzers"></ol>
        <div class="github-actions"><button value="cancel">Close</button></div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
